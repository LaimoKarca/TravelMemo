name: travelmemo
services:
  neo4j:
    image: neo4j:2026.10.2
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
    networks:
      private:
        ipv4_address: 172.30.80.30
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/7687']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 1536m
    cpus: 1
    restart: unless-stopped
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  api:
    image: travelmemo-api:${RELEASE_ID:-phase2}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      APP_ENV: production
      PUBLIC_URL: https://travel.tan-ji.org
      COOKIE_SECURE: 'true'
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?Set ALLOWED_EMAILS}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      TRUSTED_PROXY_IPS: 172.30.80.10
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_AUTH: 'true'
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    networks:
      private:
        ipv4_address: 172.30.80.20
    depends_on:
      neo4j: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/ready", timeout=4)']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 1536m
    cpus: 1
    restart: unless-stopped
    logging: *logs

  web:
    image: travelmemo-web:${RELEASE_ID:-phase2}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    networks:
      private:
        ipv4_address: 172.30.80.10
        aliases: [travelmemo-web]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    restart: unless-stopped
    logging: *logs

networks:
  private:
    name: travelmemo-net
    ipam:
      config: [{subnet: 172.30.80.0/24}]
volumes:
  neo4j-data:
