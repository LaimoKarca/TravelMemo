name: travelmemo
services:
  neo4j:
    image: neo4j:2026.10.2
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
    networks:
      private:
        ipv4_address: 172.30.80.30
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/7687']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 1536m
    cpus: 1
    restart: unless-stopped
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  api:
    image: travelmemo-api:${RELEASE_ID:-v1}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      APP_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your HTTPS website URL}
      COOKIE_SECURE: 'true'
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?Set ALLOWED_EMAILS}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      TRUSTED_PROXY_IPS: 172.30.80.10
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_AUTH: 'true'
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-45}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2000}
      FOOTPRINT_ASSIST_MAX_OUTPUT_TOKENS: ${FOOTPRINT_ASSIST_MAX_OUTPUT_TOKENS:-6000}
      FOOTPRINT_ASSIST_CONCURRENCY: ${FOOTPRINT_ASSIST_CONCURRENCY:-2}
      AI_USER_CONCURRENCY: ${AI_USER_CONCURRENCY:-1}
      AI_GLOBAL_CONCURRENCY: ${AI_GLOBAL_CONCURRENCY:-2}
      CONVERSATION_HISTORY_LIMIT: ${CONVERSATION_HISTORY_LIMIT:-12}
      CONVERSATION_EVIDENCE_LIMIT: ${CONVERSATION_EVIDENCE_LIMIT:-8}
      CONVERSATION_SUMMARY_TRIGGER: ${CONVERSATION_SUMMARY_TRIGGER:-12}
      CONVERSATION_SUMMARY_CHARS_TRIGGER: ${CONVERSATION_SUMMARY_CHARS_TRIGGER:-12000}
      CONVERSATION_PROMPT_MAX_CHARS: ${CONVERSATION_PROMPT_MAX_CHARS:-24000}
      VISION_MODEL: ${VISION_MODEL:-}
      MEDIA_ROOT: /app/media
      MEDIA_UPLOAD_MAX_BYTES: ${MEDIA_UPLOAD_MAX_BYTES:-20971520}
      MEDIA_MAX_PIXELS: ${MEDIA_MAX_PIXELS:-50000000}
      MEDIA_MAX_DIMENSION: ${MEDIA_MAX_DIMENSION:-2048}
      MEDIA_IMAGE_MAX_BYTES: ${MEDIA_IMAGE_MAX_BYTES:-524288}
      MEDIA_THUMBNAIL_MAX_BYTES: ${MEDIA_THUMBNAIL_MAX_BYTES:-65536}
      MEDIA_USER_QUOTA_BYTES: ${MEDIA_USER_QUOTA_BYTES:-262144000}
      MEDIA_GLOBAL_QUOTA_BYTES: ${MEDIA_GLOBAL_QUOTA_BYTES:-5368709120}
      MEDIA_POLL_SECONDS: ${MEDIA_POLL_SECONDS:-3}
      MEDIA_ORPHAN_SECONDS: ${MEDIA_ORPHAN_SECONDS:-3600}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}
      EMBEDDING_MODEL_DIR: /app/data/models/multilingual-e5-small
      EMBEDDING_POLL_SECONDS: ${EMBEDDING_POLL_SECONDS:-3}
      EMBEDDING_RETRY_SECONDS: ${EMBEDDING_RETRY_SECONDS:-60}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-50}
      RRF_K: ${RRF_K:-60}
      RELATION_WEIGHT: ${RELATION_WEIGHT:-0.5}
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    volumes:
      - model-data:/app/data
      - media-data:/app/media
    networks:
      private:
        ipv4_address: 172.30.80.20
    depends_on:
      neo4j: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/ready", timeout=4)']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 2048m
    cpus: 1
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logs

  web:
    image: travelmemo-web:${RELEASE_ID:-v1}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    networks:
      private:
        ipv4_address: 172.30.80.10
        aliases: [travelmemo-web]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    restart: unless-stopped
    logging: *logs

networks:
  private:
    name: travelmemo-net
    ipam:
      config: [{subnet: 172.30.80.0/24}]
volumes:
  neo4j-data:
  model-data:
  media-data:
