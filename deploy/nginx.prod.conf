server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;

    # The only network caller is the dedicated Cloudflare connector.
    allow 172.30.80.2;
    allow 127.0.0.1;
    deny all;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Cloudflare injects its browser checks and analytics at the edge. Keep
    # framing/form restrictions without blocking those edge-managed scripts.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location = /api/v1/photos {
        client_max_body_size 21m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Discard user supplied forwarding chains. Cloudflare sets this header.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
