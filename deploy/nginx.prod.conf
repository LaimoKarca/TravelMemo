server {
    listen 80 default_server;
    server_name travel.tan-ji.org;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;

    # The only network caller is the dedicated Cloudflare connector.
    allow 172.30.80.2;
    allow 127.0.0.1;
    deny all;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Discard user supplied forwarding chains. Cloudflare sets this header.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
