[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travelmemo"
version = "1.0.0"
description = "Private travel memories with evidence-backed recall"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
    "neo4j>=6,<7", "email-validator>=2.2,<3", "tzdata>=2025.1",
    "numpy>=2,<3", "rank-bm25==0.2.2", "transformers>=4.50,<5",
    "torch>=2.6,<3", "openai>=2,<4",
    "Pillow==13.0.0", "pillow-heif==1.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
